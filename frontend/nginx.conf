server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API calls -> backend container (name "backend" on the Docker network)
    location /entreprise/      { proxy_pass http://backend:8080; }
    location /equipe/          { proxy_pass http://backend:8080; }
    location /projet/          { proxy_pass http://backend:8080; }
    location /projet-detaille/ { proxy_pass http://backend:8080; }

    # Angular routes (/entreprises, /projets...) -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
